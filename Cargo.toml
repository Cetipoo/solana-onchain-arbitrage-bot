[package]
name = "solana-onchain-arbitrage-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
description = "A simple Solana onchain arbitrage bot"
repository = "https://github.com/Cetipoo/solana-onchain-arbitrage-bot"
license = "MIT"

[workspace]
members = [".", "lib/executor-v10-abi"]

[lib]
name = "solana_onchain_arbitrage_bot"
path = "src/lib.rs"

[dependencies]
executor-v10-abi = { path = "lib/executor-v10-abi" }
solana-sdk = "4.1"
solana-client = "4.3"
solana-commitment-config = "3"
spl-associated-token-account-interface = "2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
anyhow = "1.0"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
